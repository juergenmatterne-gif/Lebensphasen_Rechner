<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Seite nicht gefunden</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      font-family:system-ui,Segoe UI,Arial;
      background:#f3f4f8;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      text-align:center;
    }
    .box{
      background:#fff;
      padding:30px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      max-width:400px;
    }
    h1{margin:0;font-size:26px;color:#1e3a8a}
    p{color:#555;margin:12px 0 20px}
    a{
      display:inline-block;
      padding:10px 16px;
      background:#1d4ed8;
      color:#fff;
      text-decoration:none;
      border-radius:10px;
      font-weight:600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404 – Seite nicht gefunden</h1>
    <p>Die angeforderte Seite existiert nicht oder wurde verschoben.</p>
    <a href="index.html">Zurück zum Rechner</a>
  </div>
</body>
</html>
